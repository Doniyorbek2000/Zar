services:
  postgres:
    image: postgres:16-alpine
    container_name: zarpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zarpos
      POSTGRES_PASSWORD: zarpos
      POSTGRES_DB: zarpos
    ports:
      - "5432:5432"
    volumes:
      - zarpos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarpos -d zarpos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zarpos_pgdata:
